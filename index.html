<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d6aa17">
<title>台灣選物販賣機 II 代</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101010;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;touch-action:none}
#app{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;z-index:20;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.stats{background:#151515dd;color:#fff;border-radius:12px;padding:10px 13px;line-height:1.55;font-weight:800;font-size:13px;box-shadow:0 4px 14px #0006}
.brand{flex:1;text-align:center;color:#fff;text-shadow:0 2px 7px #000}.brand b{display:block;font-size:20px;letter-spacing:1px}.brand small{font-size:11px;opacity:.82}
.actions{display:flex;flex-direction:column;gap:7px;pointer-events:auto}.chip{border:0;background:#151515dd;color:#fff;border-radius:10px;padding:9px 10px;font-size:12px;text-align:center}
#msg{position:fixed;z-index:21;top:calc(env(safe-area-inset-top) + 84px);left:50%;transform:translateX(-50%);background:#111d;color:#fff;padding:8px 14px;border-radius:12px;font-weight:800;font-size:13px;white-space:nowrap}
.controls{position:fixed;z-index:30;left:0;right:0;bottom:0;height:250px;pointer-events:none}
#joy{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom) + 22px);width:148px;height:148px;border-radius:50%;background:#ffffff20;border:1px solid #ffffff66;box-shadow:inset 0 0 26px #fff2;pointer-events:auto;backdrop-filter:blur(6px)}
#knob{position:absolute;left:45px;top:45px;width:58px;height:58px;border-radius:50%;background:#f4f4f4;box-shadow:0 6px 16px #0006}
#grab{position:absolute;right:24px;bottom:calc(env(safe-area-inset-bottom) + 38px);width:118px;height:118px;border-radius:50%;border:9px solid #ff9d9d;background:#eb4545;color:#fff;font-weight:900;font-size:22px;box-shadow:0 8px 16px #0008;pointer-events:auto}
#grab:disabled{opacity:.45}
#powerWrap{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 174px);color:#fff;text-shadow:0 1px 4px #000;font-size:11px;pointer-events:auto}
#power{width:130px}
#modeWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 30px);display:flex;gap:6px;pointer-events:auto}
.modeBtn{border:0;border-radius:9px;padding:8px 10px;background:#111d;color:#fff;font-weight:800}
.modeBtn.on{background:#f0c52f;color:#3d3000}
.tip{position:fixed;z-index:31;left:50%;bottom:calc(env(safe-area-inset-bottom) + 5px);transform:translateX(-50%);color:#fff9;font-size:10px;pointer-events:none}
#panel{position:fixed;z-index:50;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:24px}
#panel.show{display:flex}
.card{width:min(420px,100%);background:#f4efe3;border-radius:18px;padding:18px;color:#222;box-shadow:0 18px 60px #0008}
.card h3{margin:0 0 14px}.row{display:flex;align-items:center;gap:10px;margin:12px 0}.row label{flex:1}.row input{width:150px}.close{width:100%;border:0;border-radius:12px;background:#d6aa17;padding:12px;font-weight:900;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="stats">
    投幣 <span id="coins">30</span><br>
    出貨 <span id="score">0</span><br>
    保夾倒數 <span id="guarantee">10</span>
  </div>
  <div class="brand">
    <b>選物販賣機 II 代</b>
    <small>CATCH YOUR DREAM</small>
  </div>
  <div class="actions">
    <button class="chip" id="settingsBtn">⚙ 設定</button>
    <button class="chip" id="viewBtn">📷 視角</button>
  </div>
</div>

<div id="msg">拖左下搖桿移動天車</div>

<div class="controls">
  <div id="joy"><div id="knob"></div></div>
  <div id="powerWrap">爪力 <input id="power" type="range" min="35" max="100" value="66"></div>
  <div id="modeWrap">
    <button class="modeBtn on" id="weakBtn">弱爪</button>
    <button class="modeBtn" id="strongBtn">強爪</button>
  </div>
  <button id="grab">夾取</button>
</div>

<div class="tip">台灣一般選物販賣機・公仔盒版</div>

<div id="panel">
  <div class="card">
    <h3>機台設定</h3>
    <div class="row"><label>保夾局數</label><input id="guaranteeInput" type="range" min="3" max="20" value="10"></div>
    <div class="row"><label>摩擦力</label><input id="frictionInput" type="range" min="20" max="90" value="52"></div>
    <div class="row"><label>盒子重量</label><input id="massInput" type="range" min="40" max="120" value="72"></div>
    <button class="close" id="closePanel">完成</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

const $=s=>document.querySelector(s);
const app=$('#app'), msg=$('#msg'), coinEl=$('#coins'), scoreEl=$('#score'), guaranteeEl=$('#guarantee');
const grabBtn=$('#grab'), powerEl=$('#power'), weakBtn=$('#weakBtn'), strongBtn=$('#strongBtn');
const panel=$('#panel'), guaranteeInput=$('#guaranteeInput'), frictionInput=$('#frictionInput'), massInput=$('#massInput');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x151515);
scene.fog=new THREE.Fog(0x151515,14,24);

const camera=new THREE.PerspectiveCamera(49,innerWidth/innerHeight,.1,100);
let cameraMode=0;
function setCamera(){
  if(cameraMode===0){camera.position.set(0,5.9,10.2);camera.lookAt(0,2.45,0)}
  else{camera.position.set(4.8,5.8,7.6);camera.lookAt(0,2.3,0)}
}
setCamera();

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x242424,2.0));
const key=new THREE.DirectionalLight(0xffffff,2.6); key.position.set(4,9,6); key.castShadow=true; key.shadow.mapSize.set(1024,1024); scene.add(key);
const warm=new THREE.PointLight(0xffdfa0,2.0,16); warm.position.set(0,5.2,3.1); scene.add(warm);

const world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});
world.solver.iterations=14;
world.defaultContactMaterial.friction=.52;
world.defaultContactMaterial.restitution=.025;

const mat=(c,r=.55,m=.05,t=false,o=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,transparent:t,opacity:o});
function box(w,h,d,m,x,y,z,cast=true){
  const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  q.position.set(x,y,z); q.castShadow=cast; q.receiveShadow=true; scene.add(q); return q;
}
function staticBox(w,h,d,x,y,z,m){
  if(m) box(w,h,d,m,x,y,z,false);
  const b=new CANNON.Body({mass:0,shape:new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)),position:new CANNON.Vec3(x,y,z)});
  world.addBody(b); return b;
}

const yellow=mat(0xd7ac18,.42,.18), metal=mat(0xa5a8ad,.28,.78), floorMat=mat(0xdfd5c0,.92);
box(6.55,.46,4.85,yellow,0,5.4,0,false);
box(6.55,.54,4.85,yellow,0,-.14,0,false);
[[-3.12,2.62,-2.2],[3.12,2.62,-2.2],[-3.12,2.62,2.2],[3.12,2.62,2.2]].forEach(p=>box(.23,5.32,.23,yellow,...p,false));
box(6.0,.18,.18,metal,0,4.98,-.95,false);
box(.18,.16,3.5,metal,0,4.92,-.15,false);
staticBox(5.78,.20,3.98,0,.12,0,floorMat);

const glass=mat(0xcfefff,.08,0,true,.075);
box(6.0,4.82,.03,glass,0,2.56,2.2,false);
box(.03,4.82,4.28,glass,-3.03,2.56,0,false);
box(.03,4.82,4.28,glass,3.03,2.56,0,false);

const signCanvas=document.createElement('canvas'); signCanvas.width=1200; signCanvas.height=300;
const sctx=signCanvas.getContext('2d');
sctx.fillStyle='#e4bd2d'; sctx.fillRect(0,0,1200,300);
sctx.fillStyle='#743a1b'; sctx.textAlign='center'; sctx.font='bold 104px sans-serif'; sctx.fillText('選物販賣機 II 代',600,130);
sctx.font='bold 42px sans-serif'; sctx.fillText('CATCH YOUR DREAM',600,208);
const sign=new THREE.Mesh(new THREE.PlaneGeometry(5.65,1.42),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(signCanvas)}));
sign.position.set(0,5.12,2.31); scene.add(sign);

box(1.67,.06,1.18,mat(0x171717,.9),-1.73,.24,1.23,false);
staticBox(.16,.36,1.28,-2.57,.36,1.23,yellow);
staticBox(.16,.36,1.28,-.89,.36,1.23,yellow);
staticBox(1.84,.36,.16,-1.73,.36,.62,yellow);

// 台灣常見盒裝公仔比例：正面寬、厚度較薄
const prizes=[];
const themes=[
  ['LIMITED',0xf8e8e8,0xcf5555],
  ['FIGURE',0xeaf0ff,0x557bd5],
  ['ANIME',0xfff2d9,0xd39b2e],
  ['COLLECT',0xeee8ff,0x7356ba],
  ['SPECIAL',0xe8f7e5,0x5b9f58],
  ['PREMIUM',0xe9f6f7,0x4b99a5]
];

function makeLabel(i){
  const [title,bg,accent]=themes[i%themes.length];
  const c=document.createElement('canvas'); c.width=256; c.height=384; const x=c.getContext('2d');
  x.fillStyle='#'+bg.toString(16).padStart(6,'0'); x.fillRect(0,0,256,384);
  x.fillStyle='#222'; x.font='bold 24px sans-serif'; x.fillText(title,18,38);
  x.fillStyle='#'+accent.toString(16).padStart(6,'0'); x.fillRect(22,78,212,220);
  x.fillStyle='#fff'; x.font='bold 54px sans-serif'; x.textAlign='center'; x.fillText(String((i%12)+1).padStart(2,'0'),128,215);
  x.fillStyle='#222'; x.font='bold 17px sans-serif'; x.fillText('TAIWAN PRIZE BOX',128,340);
  return new THREE.CanvasTexture(c);
}
function spawnPrizes(){
  for(const o of prizes){scene.remove(o.m);world.removeBody(o.b)}
  prizes.length=0;
  const massBase=Number(massInput.value)/100;
  for(let i=0;i<24;i++){
    const sx=.62+Math.random()*.12, sy=.84+Math.random()*.15, sz=.29+Math.random()*.08;
    const m=box(sx,sy,sz,new THREE.MeshStandardMaterial({map:makeLabel(i),roughness:.58}),-2.2+Math.random()*4.4,.55+Math.random()*1.7,-1.38+Math.random()*2.45);
    const b=new CANNON.Body({mass:massBase+Math.random()*.18,shape:new CANNON.Box(new CANNON.Vec3(sx/2,sy/2,sz/2))});
    b.position.set(m.position.x,m.position.y,m.position.z);
    b.quaternion.setFromEuler((Math.random()-.5)*.48,Math.random()*2.3,(Math.random()-.5)*.48);
    b.linearDamping=.08; b.angularDamping=.18; world.addBody(b); prizes.push({m,b,alive:true});
  }
}
spawnPrizes();

const rig=new THREE.Group(); scene.add(rig); rig.position.set(0,4.66,-.2);
const carriage=new THREE.Mesh(new THREE.BoxGeometry(.76,.29,.74),yellow); carriage.castShadow=true; rig.add(carriage);
const rod=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,1.17,12),metal); rod.position.y=-.75; rig.add(rod);
const hub=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.30,16),metal); hub.rotation.x=Math.PI/2; hub.position.y=-1.4; rig.add(hub);

const claws=[];
[0,Math.PI*2/3,Math.PI*4/3].forEach(a=>{
  const g=new THREE.Group(); g.position.y=-1.47; g.rotation.y=a;
  const arm=new THREE.Mesh(new THREE.BoxGeometry(.075,.80,.075),metal); arm.position.set(.30,-.37,0); arm.rotation.z=-.43; arm.castShadow=true; g.add(arm);
  const tip=new THREE.Mesh(new THREE.BoxGeometry(.09,.42,.12),metal); tip.position.set(.50,-.80,0); tip.rotation.z=.60; tip.castShadow=true; g.add(tip);
  rig.add(g); claws.push(g);
});

let x=0,z=-.2,y=4.66,targetY=4.66,busy=false,closed=false;
let coins=30,score=0,playCount=0,held=null,strongMode=false;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function wait(test,ms){return new Promise(r=>{const s=performance.now();(function f(){if(test()||performance.now()-s>ms)r();else requestAnimationFrame(f)})()})}
function nearest(){
  let best=null,bd=999;
  for(const o of prizes){
    if(!o.alive)continue;
    const d=Math.hypot(o.b.position.x-x,o.b.position.z-z,(o.b.position.y-(y-2.08))*.67);
    if(d<bd){bd=d;best=o}
  }
  return bd<.84?best:null;
}
function setMode(strong){
  strongMode=strong;
  weakBtn.classList.toggle('on',!strong);
  strongBtn.classList.toggle('on',strong);
  msg.textContent=strong?'已切換強爪':'已切換弱爪';
}
weakBtn.onclick=()=>setMode(false);
strongBtn.onclick=()=>setMode(true);

async function grabCycle(){
  if(busy||coins<=0)return;
  busy=true; grabBtn.disabled=true; coins--; playCount++;
  coinEl.textContent=coins;
  const guaranteeEvery=Number(guaranteeInput.value);
  const remain=guaranteeEvery-(playCount%guaranteeEvery);
  guaranteeEl.textContent=(remain===guaranteeEvery?guaranteeEvery:remain);
  msg.textContent='下爪…'; targetY=2.56;
  await wait(()=>Math.abs(y-targetY)<.04,1800);

  closed=true; msg.textContent='收爪'; await sleep(300);
  const p=nearest();
  const base=Number(powerEl.value)/100;
  const guaranteed=playCount%guaranteeEvery===0;
  const effective=guaranteed?1:(strongMode?Math.min(1,base+.20):base*.70);
  if(p && Math.random()<(.26+effective*.62)){
    held=p;
    p.b.type=CANNON.Body.KINEMATIC;
    p.b.velocity.set(0,0,0);
    p.b.angularVelocity.set(0,0,0);
  }

  targetY=4.66; msg.textContent=held?'夾起來了！':'沒夾到…';
  await wait(()=>Math.abs(y-targetY)<.04,1900);

  closed=false;
  if(held){
    const keepChance=guaranteed?.985:(.34+effective*.54);
    const current=held;
    current.b.type=CANNON.Body.DYNAMIC; current.b.wakeUp();
    if(Math.random()>keepChance){
      current.b.applyImpulse(new CANNON.Vec3((Math.random()-.5)*.4,0,(Math.random()-.5)*.4));
      msg.textContent='弱爪滑落！';
    }else{
      msg.textContent=guaranteed?'保夾強爪！':'放爪';
    }
    held=null;
  }
  await sleep(420);
  busy=false; grabBtn.disabled=false;
}
grabBtn.onclick=grabCycle;

const joy=$('#joy'),knob=$('#knob');let active=false,jx=0,jy=0;
function setJoy(e){
  const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy,L=Math.hypot(dx,dy)||1;
  if(L>44){dx*=44/L;dy*=44/L}
  jx=dx/44; jy=dy/44; knob.style.transform=`translate(${dx}px,${dy}px)`;
}
joy.onpointerdown=e=>{active=true;joy.setPointerCapture(e.pointerId);setJoy(e)};
joy.onpointermove=e=>{if(active)setJoy(e)};
joy.onpointerup=joy.onpointercancel=()=>{active=false;jx=jy=0;knob.style.transform=''};

$('#settingsBtn').onclick=()=>panel.classList.add('show');
$('#closePanel').onclick=()=>{
  world.defaultContactMaterial.friction=Number(frictionInput.value)/100;
  panel.classList.remove('show');
};
$('#viewBtn').onclick=()=>{cameraMode=(cameraMode+1)%2;setCamera()};

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),1/30);
  if(!busy){
    x=Math.max(-2.36,Math.min(2.36,x+jx*dt*2.38));
    z=Math.max(-1.46,Math.min(1.38,z+jy*dt*2.08));
  }
  y+=(targetY-y)*Math.min(1,dt*4.6);
  rig.position.set(x,y,z);
  claws.forEach(g=>g.rotation.z=closed?.30:0);

  if(held){
    held.b.position.set(x,y-1.98,z);
    held.b.quaternion.set(0,0,0,1);
  }

  world.step(1/60,dt,4);
  for(const o of prizes){
    if(!o.alive)continue;
    o.m.position.copy(o.b.position);
    o.m.quaternion.copy(o.b.quaternion);

    const p=o.b.position;
    if(p.x<-1.02 && p.z>.68 && p.y<.23){
      o.alive=false; scene.remove(o.m); world.removeBody(o.b);
      score++; scoreEl.textContent=score; msg.textContent='出貨成功！ 🎉';
    }
  }
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
