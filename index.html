<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Claw Machine 3D V1</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:-apple-system,sans-serif;touch-action:none}
#app{position:fixed;inset:0}canvas{display:block}
.top{position:fixed;z-index:10;left:0;right:0;top:0;padding:12px;color:white;display:flex;gap:8px;align-items:center}
.title{flex:1;text-shadow:0 2px 6px #000}.title b{display:block;font-size:18px}.title small{opacity:.8}
.pill{background:#eef5f8e8;color:#284a5c;padding:8px 10px;border-radius:16px;font-weight:800;font-size:12px}
#msg{position:fixed;z-index:11;top:68px;left:50%;transform:translateX(-50%);background:#111c;color:#fff;padding:8px 14px;border-radius:12px;font-weight:800;font-size:13px;white-space:nowrap}
#joy{position:fixed;z-index:12;left:24px;bottom:28px;width:140px;height:140px;border-radius:50%;background:#ffffff24;border:1px solid #ffffff66}
#knob{position:absolute;left:42px;top:42px;width:56px;height:56px;border-radius:50%;background:white;box-shadow:0 5px 15px #0006}
#grab{position:fixed;z-index:12;right:24px;bottom:38px;width:110px;height:110px;border-radius:50%;border:8px solid #ff8b8b;background:#ed4040;color:#fff;font-size:22px;font-weight:900}
#powerWrap{position:fixed;z-index:12;right:16px;bottom:158px;color:#fff;font-size:11px;text-shadow:0 1px 4px #000}
#power{width:120px}
</style>
</head>
<body>
<div id="app"></div>
<div class="top"><div class="title"><b>娃娃機店・3D 模擬台</b><small>Three.js + 物理碰撞</small></div><div class="pill" id="coin">代幣 30</div><div class="pill" id="score">出貨 0</div></div>
<div id="msg">拖左下搖桿移動天車</div>
<div id="joy"><div id="knob"></div></div>
<div id="powerWrap">爪力 <input id="power" type="range" min="35" max="100" value="68"></div>
<button id="grab">抓取</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

const app=document.querySelector('#app'),msg=document.querySelector('#msg'),coinEl=document.querySelector('#coin'),scoreEl=document.querySelector('#score'),grab=document.querySelector('#grab'),power=document.querySelector('#power');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ba4a8);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);camera.position.set(0,6.2,10.5);camera.lookAt(0,2.5,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;app.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x33444a,2));
const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(4,8,5);dl.castShadow=true;scene.add(dl);

const world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});world.solver.iterations=12;
function sm(c,t=false,o=1){return new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.1,transparent:t,opacity:o})}
function box(w,h,d,m,x,y,z){const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;scene.add(q);return q}
function staticBox(w,h,d,x,y,z,vis=true,m=sm(0xe7e1d4)){if(vis)box(w,h,d,m,x,y,z);const b=new CANNON.Body({mass:0,shape:new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)),position:new CANNON.Vec3(x,y,z)});world.addBody(b)}

staticBox(5.8,.18,4,0,.08,0,true,sm(0xe7dfcf));
const frame=sm(0xe9e3d8);[[-3,2.6,-2,.16,5.2,.16],[3,2.6,-2,.16,5.2,.16],[-3,2.6,2,.16,5.2,.16],[3,2.6,2,.16,5.2,.16],[0,5.15,-2,6,.16,.16],[0,5.15,2,6,.16,.16]].forEach(v=>box(v[3],v[4],v[5],frame,v[0],v[1],v[2]));
box(6,5,.03,sm(0xccefff,true,.1),0,2.6,2);
box(5.1,.1,.12,sm(0x666666),0,4.72,-.6);
box(1.55,.05,1.1,sm(0x20242a),-1.7,.2,1.15);

const prizes=[];const cols=[0xf2f2f2,0xb8d2ec,0xf4c8da,0xc7e2c5,0xf2d8a7,0xd4c5ef];
for(let i=0;i<18;i++){const sx=.42+Math.random()*.14,sy=.52+Math.random()*.22,sz=.38+Math.random()*.12;const m=box(sx,sy,sz,sm(cols[i%cols.length]),-2.2+Math.random()*4.4,.5+Math.random()*1.7,-1.45+Math.random()*2.5);const b=new CANNON.Body({mass:.5+Math.random()*.3,shape:new CANNON.Box(new CANNON.Vec3(sx/2,sy/2,sz/2))});b.position.set(m.position.x,m.position.y,m.position.z);b.quaternion.setFromEuler(Math.random()*.3,Math.random()*2,Math.random()*.3);b.angularDamping=.15;world.addBody(b);prizes.push({m,b,alive:true})}

const rig=new THREE.Group();scene.add(rig);rig.position.set(0,4.5,-.1);
const car=new THREE.Mesh(new THREE.BoxGeometry(.58,.22,.55),sm(0x55585c));rig.add(car);
const cable=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,1.2,10),sm(0x3b3b3b));cable.position.y=-.7;rig.add(cable);
const hub=new THREE.Mesh(new THREE.SphereGeometry(.18,14,10),sm(0x707478));hub.position.y=-1.32;rig.add(hub);
const groups=[];[0,Math.PI*2/3,Math.PI*4/3].forEach(a=>{const g=new THREE.Group();g.position.y=-1.36;g.rotation.y=a;const arm=new THREE.Mesh(new THREE.BoxGeometry(.08,.8,.08),sm(0x656a6f));arm.position.set(.28,-.35,0);arm.rotation.z=-.42;g.add(arm);const tip=new THREE.Mesh(new THREE.BoxGeometry(.1,.35,.12),sm(0x555b60));tip.position.set(.48,-.75,0);tip.rotation.z=.55;g.add(tip);rig.add(g);groups.push(g)});

let x=0,z=-.1,y=4.5,targetY=4.5,closed=false,busy=false,coins=30,score=0,held=null;
function nearest(){let best=null,bd=999;for(const o of prizes){if(!o.alive)continue;const d=Math.hypot(o.b.position.x-x,o.b.position.z-z,(o.b.position.y-(y-2))*.7);if(d<bd){bd=d;best=o}}return bd<.72?best:null}
async function cycle(){if(busy||coins<=0)return;busy=true;grab.disabled=true;coinEl.textContent='代幣 '+(--coins);msg.textContent='下爪…';targetY=2.55;await wait(()=>Math.abs(y-targetY)<.04,1800);closed=true;msg.textContent='收爪';await sleep(280);const p=nearest();if(p&&Math.random()<Number(power.value)/100*.85){held=p;p.b.type=CANNON.Body.KINEMATIC;p.b.velocity.set(0,0,0)}targetY=4.5;msg.textContent=held?'夾起來了！':'沒夾到…';await wait(()=>Math.abs(y-targetY)<.04,1900);closed=false;if(held){held.b.type=CANNON.Body.DYNAMIC;held.b.wakeUp();held=null}await sleep(400);busy=false;grab.disabled=false}
grab.onclick=cycle;

const joy=document.querySelector('#joy'),knob=document.querySelector('#knob');let active=false,jx=0,jy=0;
function joyPos(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,L=Math.hypot(dx,dy)||1;if(L>42){dx*=42/L;dy*=42/L}jx=dx/42;jy=dy/42;knob.style.transform=`translate(${dx}px,${dy}px)`}
joy.onpointerdown=e=>{active=true;joy.setPointerCapture(e.pointerId);joyPos(e)};joy.onpointermove=e=>{if(active)joyPos(e)};joy.onpointerup=joy.onpointercancel=()=>{active=false;jx=jy=0;knob.style.transform=''};

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function wait(test,ms){return new Promise(r=>{const s=performance.now();(function f(){if(test()||performance.now()-s>ms)r();else requestAnimationFrame(f)})()})}

const clock=new THREE.Clock();
function anim(){requestAnimationFrame(anim);const dt=Math.min(clock.getDelta(),1/30);if(!busy){x=Math.max(-2.3,Math.min(2.3,x+jx*dt*2.4));z=Math.max(-1.45,Math.min(1.35,z+jy*dt*2.1))}y+=(targetY-y)*Math.min(1,dt*4.5);rig.position.set(x,y,z);groups.forEach(g=>g.rotation.z=closed?.27:0);
if(held){held.b.position.set(x,y-1.85,z);held.b.quaternion.set(0,0,0,1)}
world.step(1/60,dt,4);for(const o of prizes){if(!o.alive)continue;o.m.position.copy(o.b.position);o.m.quaternion.copy(o.b.quaternion);const p=o.b.position;if(p.x<-1&&p.z>.65&&p.y<.22){o.alive=false;scene.remove(o.m);world.removeBody(o.b);scoreEl.textContent='出貨 '+(++score);msg.textContent='出貨成功！ 🎉'}}
renderer.render(scene,camera)}
anim();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
